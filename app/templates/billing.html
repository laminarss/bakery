{% extends "base.html" %}
{% block title %}Billing{% endblock %}
{% block content %}
<h1>Billing Page</h1>
<form id="billing-form">
  <label>Customer Email <input id="customer-email" type="email" required></label>

  <h2>Bill Section</h2>
  <div id="items"></div>
  <button type="button" id="add-item">Add New</button>

  <h2>Denominations</h2>
  <div id="denominations"></div>

  <label>Cash paid by customer <input id="amount-paid" type="number" min="0" step="0.01" required></label>
  <p id="error" class="error"></p>
  <button type="reset">Cancel</button>
  <button type="submit">Generate Bill</button>
</form>
<script>
const denominationValues = [500, 50, 20, 10, 5, 2, 1];
const items = document.getElementById('items');
const denominations = document.getElementById('denominations');

function addItem() {
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `<input class="product-id" placeholder="Product ID" required>
                   <input class="quantity" type="number" min="1" placeholder="Quantity" required>
                   <button type="button" class="remove">Remove</button>`;
  row.querySelector('.remove').onclick = () => row.remove();
  items.appendChild(row);
}

denominationValues.forEach(value => {
  const row = document.createElement('label');
  row.className = 'denom-row';
  row.innerHTML = `<span>₹${value}</span><input class="denom-count" data-value="${value}" type="number" min="0" value="0" required>`;
  denominations.appendChild(row);
});

document.getElementById('add-item').onclick = addItem;
addItem();

document.getElementById('billing-form').onsubmit = async (event) => {
  event.preventDefault();
  const error = document.getElementById('error');
  error.textContent = '';
  const payload = {
    customer_email: document.getElementById('customer-email').value,
    items: [...document.querySelectorAll('.item-row')].map(row => ({
      product_id: row.querySelector('.product-id').value.trim(),
      quantity: Number(row.querySelector('.quantity').value)
    })),
    denominations: [...document.querySelectorAll('.denom-count')].map(input => ({
      value: Number(input.dataset.value), count: Number(input.value)
    })),
    amount_paid: document.getElementById('amount-paid').value
  };
  try {
    const response = await fetch('/api/bills', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Unable to generate bill');
    window.location.href = `/bills/${data.id}`;
  } catch (err) { error.textContent = err.message; }
};
</script>
{% endblock %}
